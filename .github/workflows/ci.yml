name: CI

# PR-blocking checks for this repository:
#
# design/netlist.py --lint (schematic T {...} text-block brace guard)
#     Pure Python over design/xschem/*.sch's own text -- no xschem, no PDK.
#     Every schematic carries a `T {...}` free-text header; a literal `{` or
#     `}` inside that block (even a balanced pair) makes xschem's own parser
#     miscount and silently drop part of the exported netlist, with no error
#     from xschem and no error from netlist.py's non-lint export path either.
#     That failure mode is invisible at review time and cheap to catch at
#     authorship, so it runs on every PR touching design/ and blocks on
#     failure.
#
# design/test_pdk_search.py (shared PDK-search fallback-order unit test,
#     issue #25) -- also pure Python over design/_pdk_search.py, no xschem,
#     no PDK install, so it belongs on the same PR-blocking path as the lint
#     check above rather than the PDK-gated nightly job below.
#
# design/test_netlist_xschem_version.py (minimum-xschem-version gate, issue #151)
#     Also pure Python -- the `xschem --version` subprocess is the one thing
#     stubbed. sky130's device symbols carry device-area parameters as expr()
#     templates over @W/@nf, and only xschem >= 3.4.7 evaluates them; an older
#     xschem emits them verbatim and ngspice rejects the resulting netlist
#     outright. design/netlist.py refuses to export below design/pdk.json's
#     xschem_version_min for exactly that reason, and this fixture is that
#     refusal's regression guard. It belongs on the PR path rather than the
#     nightly precisely because the nightly cannot catch a weakened gate: an
#     export by a too-old xschem diffs clean against itself, so --check would
#     report green on an unsimulable netlist.
#
# layout/test_compose_cell.py (LVS reference-netlist rewrite unit test, issue #22)
#     Pure Python over layout/bin/compose-cell.py's build_reference/
#     extract_subckt. That code rewrites the *reference* side of every LVS run
#     under layout/ -- the netlist each composed cell is compared against. A
#     too-greedy substitution or kwarg drop silently removes a real connection
#     or parameter, and a too-timid unit rewrite leaves an unsuffixed L=/W=
#     that klt lvs reads as SI metres (klayout-tools#1492). Either way the run
#     still completes and reports a verdict about the wrong netlist, and
#     --check cannot catch it because --check re-runs the same rewrite. Same
#     PR-blocking path, same reason: it needs nothing installed.
#
# layout/test_compose_whole.py (whole-block composition contract, issue #172)
#     Pure Python over layout/bin/compose-whole.py and the committed
#     layout/trng_whole/ evidence -- no klt, no PDK, no GDS read (the geometry
#     checks that need python klayout skip themselves where it is absent). A
#     whole-block composition can fail while still producing a plausible GDS
#     and a parseable tool response: run_klt deliberately accepts a partial
#     composition (klt gen-compose exit 3), a swapped or duplicated boundary pin
#     composes and routes fine, and an unreviewed edit to a macro input would
#     silently stale the committed evidence. This pins the verdict check, the
#     port-coverage/alias audit and the recorded input hashes. Same
#     PR-blocking path, same reason: it needs nothing installed.
#
# layout/test_verify_whole.py (whole-block verification evidence contract, issue #173)
#     Pure Python over layout/bin/verify_whole_lib.py (synthetic SPICE, no klt)
#     and the committed layout/trng_whole/verify/ evidence. A "match" verdict
#     over a black-boxed digital macro proves nothing unless the pin
#     canonicaliser refuses to repair shorted ports, the endpoint audit sees a
#     moved cell pin, and every fault control reached the LVS comparison and
#     failed naming its nets; this pins those, plus that the committed reports
#     still describe the committed inputs. Same PR-blocking path, same reason:
#     it needs nothing installed.
#
# layout/test_pex_netlist.py (post-layout netlist rewrite unit test, issue #22)
#     Pure Python over layout/bin/pex-netlist.py's rewrite functions -- no klt,
#     no KLayout, no PDK, no GDS. That script turns `klt extract --parasitics`
#     output into the ngspice library sim/post-layout-ro-ring5/ simulates, and
#     each of its transformations (net rename, unit-suffix strip, device-card
#     swap) could silently produce a plausible-but-wrong netlist that
#     simulates cleanly and reports wrong numbers. Same PR-blocking path as
#     the two checks above, for the same reason: it needs nothing installed.
#
# sim/tests/test_raw_bit_entropy.py, test_raw_bit_battery.py, test_digital_section.py
#     (issue #190) -- stdlib-only unit tests over the raw-bit entropy
#     estimator, the statistical battery, and the digital section's
#     Python reference model (health-test/raw-path invariants DR-0004
#     depends on). No ngspice, no PDK. The only tool-dependent skip is
#     test_raw_bit_battery's "no campaign record" case, which unittest
#     reports as an explicit skip (not a silent pass). Previously they could
#     regress silently because nothing ran them.
#
# sim/tests/test_conditioned_output.py (issue #243) -- stdlib-only unit test
#     for the conditioned-output (DATA) analysis: pins the MSB-first word
#     serialization, block/partial-block handling, the 16 x 1024 conditioned
#     segment policy, the raw-H x 256 vs 32-bit accounting flags, and that the
#     committed record's first stream still reproduces. No ngspice, no PDK.
#
# sim/tests/test_restart_matrix.py (issue #267) -- stdlib-only unit test of the
#     restart-matrix reduction (sim/wake-up-transient/restart_matrix.py) the C5
#     silicon restart dataset will go through: IID known-answer PASS, a
#     deterministic-column FAIL naming its index, the 1000 x 2048 boundary and
#     fail-closed input checks, and a replay of one point of the committed
#     behavioural record. No ngspice, no PDK.
#
# sim/tests/test_evidence_record_artifacts.py (issue #273) -- stdlib-only temp-directory
#     test that mint_behavioral_record refuses colliding or repeated artifact
#     basenames before creating any record/run output, and that unique names
#     keep their bytes and the artifacts list format. Covered by the existing
#     sim/bin/** and sim/tests/** path filters.
#
# signoff-check (issue #155) -- the gap-to-T1 tier report staleness gate.
#     `klt signoff --manifest signoff/block-manifest.json` re-renders this
#     block's graded T1 item table from the committed evidence envelopes
#     and the output is byte-diffed against the committed
#     signoff/t1-report.json. Grading is a pure JSON+markdown transform --
#     no xschem, no KLayout-adjacent runs, no PDK install, no GDS read --
#     so it belongs on the PR-blocking path: a manifest citation whose
#     backing envelope changed (regenerated DRC/LVS, a revised checklist
#     doc, a manifest edit without regenerating the report) turns THIS
#     run red the same day instead of rotting until a human re-reads the
#     tracker by hand -- the exact staleness mode issue #155 filed against.
#     Exit code contract: klt signoff's tier mode exits 0 only for a block
#     at tier T1 and 3 for "ran successfully, at least one item unmet" --
#     the documented mid-ladder state, not a failure -- so the job treats
#     0 and 3 as render successes and 1/2 as failures, then byte-compares.
#     The `klayout-tools==0.7.0` pin (0.6.0 until issue #164) deliberately DIVERGES from the PDK
#     nightly's install (0.5.0 from 2026-09-23, issue #160; klayout-tools
#     source commit 5edb557f91d0 since issue #181): this job is
#     a pure JSON+markdown transform with no PDK, so it follows the
#     grader release -- 0.6.0 is the first tagged build with `erc`-kind
#     grading (klayout-tools#2247) -- while the nightly's pin gates the
#     nineteen committed cells' compose-cell --check reproductions and
#     moves only with a full --check re-verification against the new
#     build (0.6.0 changed gen-compose's via-drop/tap-role handling,
#     klayout-tools#2312). The invocation still passes --tiers-doc
#     pointing at the vendored copy under signoff/ even though the 0.6.0
#     wheel's bundled copy is currently byte-identical to it: 0.6.0 pins
#     the governing checklist into the report by content hash
#     (source_doc_content_hash, klayout-tools#2191), so grading against
#     the wheel's bundled default would silently follow whatever doc a
#     future wheel bundles instead of the copy this repo reviews and
#     re-vendors deliberately. The
#     envelope-vs-artifact staleness axis (GDS changed, envelope NOT
#     regenerated) is outside this gate and is
#     covered by the PDK nightly's compose-cell --check reproductions
#     instead; see signoff/README.md's freshness section.
#
# sim/bin/check_records_append_only.py (sim/ + measurements/ append-only record rule, issues #232/#269)
#     Pure Python + git. `sim/` results and `measurements/` silicon evidence are
#     append-only (sim/README.md, measurements/README.md): the job diffs
#     base...HEAD and fails if any existing {sim,measurements}/*/records/* file
#     or record-associated runs/corners artifact is Modified, Deleted, Renamed
#     or type-changed; Added files pass. Reviewed exceptions
#     live in sim/records-append-only-allowlist.txt (empty at first). Needs
#     full history (fetch-depth: 0) and nothing installed.
#
# design/netlist.py --check (schematic-vs-netlist staleness guard) is
# DELIBERATELY NOT here. It shells out to xschem and resolves the sky130
# xschem symbol library through a real PDK install (design/pdk.json pins
# open_pdks commit c6d73a35f524070e85faff4a6a9eef49553ebc2b), neither of
# which a stock GitHub-hosted runner has -- provisioning ~1 GB of PDK on
# every pull request is not something this repo's PR path should pay for.
# See .github/workflows/pdk-nightly.yml, which provisions xschem + the
# pinned sky130 PDK (via volare) and runs --check on a schedule, on manual
# dispatch, and opt-in on a PR via the `run-pdk-check` label.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "design/**"
      - "layout/bin/**"
      # sim/tests unit tests and everything they import or read (issue #190)
      - "sim/tests/**"
      - "sim/bin/**"
      # issue #236 electrical-limit reduction controls import this module
      - "sim/digital-electrical-repair/analysis/**"
      # issue #250 final-route gate test replays these recorded runs and loads the harness
      - "sim/digital-electrical-repair/runs/**"
      - "sim/digital-electrical-repair/requests/**"
      - "sim/digital-pnr/harness/**"
      - "sim/digital-synthesis/harness/**"
      # append-only record rule (issue #232): any change under a records dir
      - "sim/*/records/**"
      - "sim/*/runs/**"
      - "sim/*/corners/**"
      - "sim/records-append-only-allowlist.txt"
      # issue #269: measured silicon records and raw captures
      - "measurements/*/records/**"
      - "measurements/*/runs/**"
      - "measurements/*/corners/**"
      - "sim/raw-bit-min-entropy/**"
      # issue #243 conditioned-output analysis + the committed streams it reads
      - "sim/digital-conditioned-output/**"
      - "sim/raw-bit-volume-campaign/records/**"
      - "sim/raw-bit-volume-campaign/runs/**"
      - "digital/model/**"
      - "sim/digital-health-test-parameters/analysis/**"
      # issue #267 restart-matrix reducer, its phase model and the PVT-set source it re-counts
      - "sim/wake-up-transient/**"
      - "sim/raw-bit-volume-campaign/behavioral_raw_bit.py"
      - "layout/test_pex_netlist.py"
      - "layout/test_compose_cell.py"
      - "layout/test_compose_whole.py"
      - "layout/test_verify_whole.py"
      # the whole-block composition's committed evidence and every input whose
      # hash it records (layout/test_compose_whole.py re-hashes them)
      - "layout/trng_whole/**"
      - "layout/sampler_core/**"
      - "layout/trng_digital/**"
      - "digital/rtl/**"
      # signoff-check inputs: the manifest + vendored checklist doc + the
      # committed report + the two envelopes it cites (an envelope
      # regenerated in a PR must re-grade, not slide through on the old
      # report bytes).
      - "signoff/**"
      - "layout/sampler_core/drc.json"
      - "layout/sampler_core/lvs.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Schematic brace-guard lint (design/netlist.py --lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: design/netlist.py --lint
        run: python3 design/netlist.py --lint

      - name: design/test_pdk_search.py (shared PDK-search unit test)
        run: python3 design/test_pdk_search.py

      - name: design/test_netlist_xschem_version.py (minimum-xschem-version gate)
        run: python3 design/test_netlist_xschem_version.py

      - name: layout/test_pex_netlist.py (post-layout netlist rewrite unit test)
        run: python3 layout/test_pex_netlist.py

      - name: layout/test_compose_cell.py (LVS reference rewrite unit test)
        run: python3 layout/test_compose_cell.py

      - name: layout/test_compose_whole.py (whole-block composition contract)
        run: python3 layout/test_compose_whole.py

      - name: layout/test_verify_whole.py (whole-block verification evidence contract)
        run: python3 layout/test_verify_whole.py

      - name: sim/tests/test_raw_bit_entropy.py (raw-bit entropy estimator unit test)
        run: python3 sim/tests/test_raw_bit_entropy.py

      - name: sim/tests/test_raw_bit_battery.py (raw-bit statistical battery unit test)
        run: python3 sim/tests/test_raw_bit_battery.py

      - name: sim/tests/test_digital_section.py (digital section reference-model test)
        run: python3 sim/tests/test_digital_section.py

      - name: sim/tests/test_health_failure_injection.py (RCT/APT failure-injector unit test)
        run: python3 sim/tests/test_health_failure_injection.py

      - name: sim/tests/test_floorplan_compaction.py (issue #226 study guard + area-model contract)
        run: python3 sim/tests/test_floorplan_compaction.py

      - name: sim/tests/test_conditioned_output.py (issue #243 conditioned DATA analysis unit test)
        run: python3 sim/tests/test_conditioned_output.py

      - name: sim/tests/test_electrical_reduction.py (issue #236 missing-corner / injected-violation / no-data reduction controls)
        run: python3 sim/tests/test_electrical_reduction.py
      - name: sim/tests/test_electrical_final_route_gate.py (issue #250 final-route electrical verdict gates digital P&R; replays recorded sessions)
        run: python3 sim/tests/test_electrical_final_route_gate.py

      - name: sim/tests/test_restart_matrix.py (issue #267 restart-matrix reduction known-answer + record replay)
        run: python3 sim/tests/test_restart_matrix.py

      - name: sim/tests/test_evidence_record_artifacts.py (issue #273 artifact basename-collision rejection)
        run: python3 sim/tests/test_evidence_record_artifacts.py

  sim-records-append-only:
    name: sim/ + measurements/ append-only evidence rule (no edit/delete/rename of committed records or raw artifacts)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: sim/tests/test_check_records_append_only.py (checker unit test)
        run: python3 sim/tests/test_check_records_append_only.py

      - name: Fail on modified/deleted/renamed {sim,measurements}/*/{records,runs,corners} evidence
        run: python3 sim/bin/check_records_append_only.py "origin/${{ github.base_ref }}"

  signoff-check:
    name: Signoff tier-report staleness gate (klt signoff --manifest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Deliberately NOT the same pin as the PDK nightly's install step
      # (0.5.0 there from 2026-09-23 -- issue #160 -- and source commit
      # 5edb557f91d0 since issue #181; 0.6.0 here): the
      # committed signoff/t1-report.json is byte-compared against this
      # build's output, so a klt release that changes grading or report
      # shape must turn THIS job red until the report is regenerated and
      # the pin consciously moved -- the same contract layout/pdk.json's
      # klt_version_pin documents for the nightly's --check runs. The
      # grader is a pure JSON transform, so it follows the grader release
      # (0.6.0: first tagged erc-kind grading build, klayout-tools#2247;
      # 0.7.0: LVS supply-pairing fix, klayout-tools#2405/#2431, issue #164)
      # alone; the nightly's pin gates the nineteen committed cells'
      # compose-cell --check reproductions and moves only with a full
      # --check re-verification (0.6.0 changed gen-compose's
      # via-drop/tap-role handling, klayout-tools#2312).
      - name: Install klt (klayout-tools, the signoff grading build)
        run: |
          pip install --user "klayout-tools==0.7.0"
          klt --version

      # Verbatim the command documented in signoff/README.md -- the report
      # embeds the --tiers-doc label and the evidence paths relative to
      # the repo root, so any other invocation produces different bytes
      # and the diff below would be meaningless.
      - name: Re-render the committed tier report and byte-diff
        shell: bash
        run: |
          set +e
          klt signoff --manifest signoff/block-manifest.json \
            --tiers-doc signoff/design-evidence-tiers.md --format json \
            > /tmp/t1-report-fresh.json
          rc=$?
          set -e
          # klt signoff --manifest exit contract: 0 = tier T1, 3 = tier
          # null (ran successfully, at least one item unmet -- this
          # block's expected state while the gap is open), 1 = input/doc
          # error, 2 = usage error. Only 1 and 2 are failures here.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "klt signoff --manifest failed (exit $rc): manifest, tiers doc, or a cited evidence envelope is unreadable/malformed" >&2
            exit 1
          fi
          echo "klt signoff rendered (exit $rc; 3 = tier null, gaps open)"
          if cmp signoff/t1-report.json /tmp/t1-report-fresh.json; then
            echo "signoff/t1-report.json matches the freshly graded report"
          else
            echo "signoff/t1-report.json is STALE -- it no longer matches a fresh grading of signoff/block-manifest.json against the current evidence." >&2
            echo "Regenerate it with the command in signoff/README.md and commit the diff." >&2
            exit 1
          fi
