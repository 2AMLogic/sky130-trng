name: PDK nightly

# The PDK-dependent half of this repository's self-checks, deliberately kept
# off the pull-request path (see ci.yml's comment for why).
#
# design/netlist.py --check re-exports every top cell in design/xschem/ into
# a temp directory and checks two independent things: (1) staleness -- the
# result matches the committed design/*.spice, which is what makes a
# netlist.sha recorded anywhere else in this repo mean "derived from the
# schematic it claims to come from" rather than "a snapshot someone forgot
# to refresh"; and (2) connectivity -- xschem's own ERC (electrical rule
# check) finds no undriven node / open net / shorted pin anywhere in that
# top cell's instantiated hierarchy (issue #16). A schematic-level wiring
# defect can produce a netlist that is internally self-consistent -- the
# "before" and "after" of a regeneration agree on the same wrong result --
# so staleness alone cannot catch it; ERC can. It shells out to xschem and
# resolves the sky130 xschem symbol library through a real PDK install, so
# it cannot run on the PR path (a pull request must never block on a ~1 GB
# PDK download).
#
# PDK provisioning: volare, pinned to the open_pdks commit design/pdk.json
# names (currently c6d73a35f524070e85faff4a6a9eef49553ebc2b -- read from
# that file at run time below, not hardcoded here, so the two can never
# silently disagree). volare is what design/netlist.py's own
# PdkNotFound/INSTALL_HINT message tells a human to install, and it puts the
# PDK at ~/.volare/<variant>, one of netlist.py's built-in search roots, so
# no SKY130_PDK_PATH / PDK_ROOT wiring is needed here. The "Resolved PDK"
# step below runs `design/netlist.py --pdk` before `--check`, so a failure
# is attributable: it prints the resolved open_pdks commit and whether it
# matches design/pdk.json's pin, distinguishing "the schematic changed" from
# "the PDK moved out from under the pin".
#
# xschem provisioning: built from source at the tag design/pdk.json's
# `xschem_version_min` names, NOT `apt-get install xschem`. This reverses an
# earlier decision in this file, so the reasoning is recorded rather than
# just the outcome (issue #151).
#
# The superseded policy said xschem "comes from the runner's distro package
# rather than a pin, because it is a netlister, not a numerical tool" -- so a
# distro version bump turning this job red was intended, with "regenerate and
# commit the diff" as the standing remedy. The premise turned out to be false
# for sky130 specifically: sky130's device symbols carry their device-area
# parameters as expr() templates over the symbol's own @W/@nf attributes
# (ad=expr('int((@nf + 2)/2) * @W / @nf * 0.29')), and evaluating those IS a
# numerical job. xschem 3.4.7 is the first release that does it; earlier
# releases copy the template through verbatim. ubuntu-noble packages 3.4.4,
# so this job never once netlisted this design correctly -- every scheduled
# run since the job landed (2026-08-25) was red, reporting the same four
# cells STALE, and nobody was paged because a nightly is not a PR check.
#
# Following the superseded remedy here would have been actively harmful, not
# merely wrong: every design/*.spice is `.include`d by ngspice testbenches
# under sim/, and the unevaluated form is not a differently-formatted netlist
# but an unrunnable one -- ngspice rejects it with "Undefined parameter [ad]"
# / "Cannot compute substitute" / "ERROR: fatal error in ngspice, exit(1)"
# (measured 2026-09-18, ngspice-46, against the pinned open_pdks commit's own
# sky130.lib.spice). `design/netlist.py --check` verifies staleness and ERC,
# never simulability, so "regenerate + commit" would have gone green while
# silently replacing the whole simulable netlist library with an unsimulable
# one.
#
# What survives of the old policy is the part that was right: this is a
# MINIMUM, not an equality pin. design/netlist.py enforces the floor itself
# (hard failure, exit 3 = environment, with its own message) so a developer
# machine cannot quietly produce the broken form either -- the "Resolved PDK"
# step below prints the resolved xschem version against that floor. A *newer*
# xschem whose formatting moves is still meant to turn --check red, loudly,
# and for that direction the remedy is still `python3 design/netlist.py`
# (regenerate) + commit the diff, noting the version bump.
#
# Built from source rather than cached: the build is ~1 minute against a job
# that already downloads a ~1 GB PDK, and a cache key is one more thing that
# can silently serve a stale artifact -- exactly the failure class this job
# exists to catch.
#
# Runs on a schedule, on manual dispatch, and opt-in on a pull request via
# the `run-pdk-check` label (e.g. to validate a schematic edit before merge
# without paying the PDK cost on every PR by default) -- the same pattern
# the sibling repo 2AMLogic/sky130-bandgap uses for its own PDK-gated job.
#
# layout-check (below) is this workflow's layout-side sibling of
# netlist-check: `layout/bin/compose-cell.py --check` re-derives a layout
# cell's whole `klt gen` -> `gen-compose` -> `drc` -> `extract` -> `lvs`
# chain into a temp directory and diffs the verdict-bearing fields against
# the committed evidence under `layout/<cell>/`, so a `klt` or PDK change
# that silently invalidates already-committed evidence (as
# klayout-tools#1491 once did, see `layout/README.md`) turns a scheduled run
# red instead of being found by hand. It runs on the exact same trigger
# surface as netlist-check, for the same reason -- see issue #36.
#
# report-failure (below) closes this workflow's silent-failure gap. Neither
# job here is a PR check, so a red run only ever appeared in the Actions tab
# -- which is how netlist-check stayed red for three weeks (issue #151)
# without anyone noticing. The job files (or comments on) a `loom:triage`
# issue whenever a scheduled or manually-dispatched run fails, putting the
# failure in the queue the fleet's roles already read instead of one nobody
# polls. It deliberately reuses a single open issue rather than filing one
# per night, so three weeks of red is one issue with a comment thread, not
# twenty-one duplicates.
#
# Note: GitHub disables scheduled workflows in a repository with no activity
# for 60 days. If this stops running, re-enable it from the Actions tab.

on:
  schedule:
    # 06:41 UTC daily. Off the hour on purpose -- the shared scheduler is
    # congested on the hour and delays runs queued there.
    - cron: "41 6 * * *"
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  # One provisioning run at a time; never cancel one in flight, since a
  # cancelled cold run wastes the whole PDK download for nothing.
  group: pdk-nightly
  cancel-in-progress: false

jobs:
  netlist-check:
    name: Schematic-vs-netlist staleness + connectivity guard (design/netlist.py --check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-pdk-check'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Put ~/.local/bin on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Read from design/pdk.json at run time, never hardcoded here, so the
      # workflow and the file netlist.py itself enforces can never silently
      # disagree -- the same discipline the open_pdks pin already uses below.
      - name: Resolve the required xschem version from design/pdk.json
        id: xschem
        run: |
          set -euo pipefail
          version="$(python3 -c "import json; print(json.load(open('design/pdk.json'))['xschem_version_min'])")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Required xschem version (design/pdk.json xschem_version_min): ${version}"

      # See this file's header comment for why this is a source build and
      # not `apt-get install xschem`: ubuntu-noble packages 3.4.4, which is
      # below the floor and emits sky130's device-area expr() templates
      # unevaluated. Deps are xschem's own INSTALL list (tcl/tk, Xlib, Xpm,
      # bison, flex, plus the optional cairo/xcb/xrender renderers).
      - name: Build + install xschem at the required version
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gawk \
            tcl-dev tk-dev \
            libx11-dev libxpm-dev libxrender-dev libxcb1-dev libcairo2-dev
          git clone --depth 1 --branch "${{ steps.xschem.outputs.version }}" \
            https://github.com/StefanSchippers/xschem.git "$RUNNER_TEMP/xschem-src"
          cd "$RUNNER_TEMP/xschem-src"
          ./configure --prefix="$HOME/.local"
          make -j"$(nproc)"
          make install
          xschem --version 2>&1 | head -n 2

      - name: Install volare (the sky130 PDK version manager)
        run: pip install --user volare

      - name: Resolve the pinned open_pdks commit from design/pdk.json
        id: pin
        run: |
          set -euo pipefail
          commit="$(python3 -c "import json; print(json.load(open('design/pdk.json'))['open_pdks_commit'])")"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "Pinned open_pdks commit (design/pdk.json): ${commit}"

      - name: Fetch + enable the pinned sky130 PDK
        run: |
          set -euo pipefail
          volare fetch --pdk sky130 "${{ steps.pin.outputs.commit }}"
          volare enable --pdk sky130 "${{ steps.pin.outputs.commit }}"

      # Prints the resolved xschem version against design/pdk.json's
      # xschem_version_min, then the resolved PDK install path, source, and
      # open_pdks commit and whether that commit matches design/pdk.json's
      # pin -- so a --check failure below is attributable to a schematic edit
      # rather than to a PDK bump or a netlister bump, before anyone has to
      # read a diff to find out. Issue #151 is exactly the failure this step
      # was meant to make legible and could not: it reported the PDK pin as
      # matching (it was) while the netlister silently emitted a different,
      # unsimulable netlist, so the only visible symptom was four STALE
      # diffs. The xschem line closes that gap.
      - name: Resolved xschem + PDK
        run: python3 design/netlist.py --pdk

      # Writes nothing: --check exports every TOP_CELLS entry into a temp
      # directory, diffs it against the committed design/*.spice (staleness),
      # and runs xschem's own ERC over it (connectivity). A connectivity
      # failure prints with an `ERC` prefix and exits EXIT_ERC (2), distinct
      # from a staleness failure's `STALE` prefix and EXIT_STALE (1).
      - name: design/netlist.py --check
        run: python3 design/netlist.py --check

      # Regression fixture for the ERC wiring itself (issue #16): confirms a
      # schematic with a deliberately broken net (a lab_pin moved off its
      # net) is actually caught, not just that the current committed
      # schematics happen to pass. See design/test_netlist_erc.py's module
      # docstring for what it checks.
      - name: design/test_netlist_erc.py (ERC regression fixture)
        run: python3 design/test_netlist_erc.py

  layout-check:
    name: Layout composition drift guard (compose-cell.py --check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-pdk-check'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # `klt` (2AMLogic/klayout-tools) is public on PyPI as tagged releases
      # (0.1.0-0.5.0 as of 2026-09-17), so a plain pip install works the same
      # way netlist-check's volare install below does -- no special runner
      # access needed. It is pinned to the latest *tagged* PyPI release
      # rather than to layout/pdk.json's committed `klt_version_pin`
      # (currently "0.3.0+gc6dbf66c53c6") because that pin is a dev snapshot
      # 162 commits ahead of the `v0.3.0` tag: PyPI has no artifact for that
      # exact commit, so `pip install klayout-tools==0.3.0` would silently
      # install an *older* build than the one that produced the committed
      # evidence (from before the klayout-tools#1491 DRC fix). Treating the
      # PyPI pin below as a provenance pin rather than a hard gate -- and
      # re-verifying/re-pinning layout/pdk.json's `klt_version_pin` whenever
      # this drifts -- mirrors how layout/pdk.json's own comment already
      # treats `klt_version_pin` for local/dev runs. See layout/pdk.json and
      # layout/README.md for the full rationale (issue #36).
      #
      # 0.5.0, not 0.4.0, is a hard floor rather than a "latest is nicer"
      # preference: 0.4.0 predates connectivity[].legs[] (klayout-tools
      # #1529/#1536), so layout/sampler_dff/cell.json -- committed on main
      # since -- fails --check against it with "error: clkb_seg2: nets left
      # unrouted by gen-compose: ['clkb_mid']". That is the layout/sampler_dff
      # exception layout/pdk.json already documents (issue #106), not drift,
      # and it alone would keep this job permanently red. All nineteen
      # committed cells were re-verified against 0.5.0 on 2026-09-17.
      #
      # DELIBERATELY still 0.5.0, not 0.6.0, since 2026-09-23 (issue #160):
      # ci.yml's signoff-check grader pin moved to 0.6.0 alone -- the
      # grader is a pure JSON transform -- but THIS pin gates the nineteen
      # committed cells' compose-cell --check reproductions, and 0.6.0
      # changed gen-compose's via-drop/tap-role handling
      # (klayout-tools#2312), so bumping it here requires re-running every
      # cell's --check against 0.6.0 and recording the result first. The
      # two pins are no longer identical; that divergence is deliberate.
      - name: Install klt (klayout-tools, the layout composition/verification CLI)
        run: |
          set -euo pipefail
          pip install --user "klayout-tools==0.5.0"

      - name: Install volare (the sky130 PDK version manager)
        run: pip install --user volare

      - name: Put ~/.local/bin on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve the pinned open_pdks commit from layout/pdk.json
        id: pin
        run: |
          set -euo pipefail
          commit="$(python3 -c "import json; print(json.load(open('layout/pdk.json'))['open_pdks_commit'])")"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "Pinned open_pdks commit (layout/pdk.json): ${commit}"

      - name: Fetch + enable the pinned sky130 PDK
        run: |
          set -euo pipefail
          volare fetch --pdk sky130 "${{ steps.pin.outputs.commit }}"
          volare enable --pdk sky130 "${{ steps.pin.outputs.commit }}"

      # Prints the klt build actually resolved on this runner (distinct from
      # layout/pdk.json's committed provenance pin) and the PDK install
      # `klt` itself resolves, so a --check failure below is attributable
      # rather than requiring a human to first ask "which klt ran?".
      - name: Resolved klt + PDK
        run: |
          set -euo pipefail
          klt --version
          klt pdk find --pdk sky130A --format json

      # Every committed layout/<cell>/cell.json descriptor, re-counted here
      # rather than hardcoded -- more are expected as issue #27 lands (see
      # layout/README.md's "What's deferred"). Fails loudly rather than
      # skipping if the glob is unexpectedly empty, and reports every
      # drifting cell (not just the first) before exiting non-zero.
      - name: compose-cell.py --check (every layout/*/cell.json)
        run: |
          set -euo pipefail
          shopt -s nullglob
          specs=(layout/*/cell.json)
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "error: no layout/*/cell.json descriptors found -- the glob should never be empty" >&2
            exit 1
          fi
          echo "Checking ${#specs[@]} cell descriptor(s): ${specs[*]}"
          failures=()
          for spec in "${specs[@]}"; do
            echo "::group::compose-cell.py --check ${spec}"
            if ! python3 layout/bin/compose-cell.py "${spec}" --check; then
              failures+=("${spec}")
            fi
            echo "::endgroup::"
          done
          if [ "${#failures[@]}" -gt 0 ]; then
            echo "DRIFT detected in: ${failures[*]}" >&2
            exit 1
          fi

  report-failure:
    name: Surface a red nightly as a loom:triage issue
    needs: [netlist-check, layout-check]
    # `failure()` is required: the default `success()` status check would
    # skip this job precisely when it is needed. Restricted to schedule /
    # workflow_dispatch because a pull_request run is already visible to
    # whoever opted it in with the run-pdk-check label -- filing an issue
    # for that would be noise, not signal.
    if: >-
      failure() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update the nightly-failure issue
        uses: actions/github-script@v7
        with:
          script: |
            // One long-lived issue per failure episode, found by a marker in
            // the body rather than by title match, so re-wording the title
            // later cannot orphan the thread and start filing duplicates.
            const MARKER = '<!-- pdk-nightly-failure-tracker -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                           `/actions/runs/${context.runId}`;
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { ...context.repo, run_id: context.runId, per_page: 100 },
            );
            const failed = jobs
              .filter((j) => j.conclusion === 'failure')
              .map((j) => `- \`${j.name}\``)
              .join('\n') || '- (no job reported a failure conclusion)';

            const body = [
              `\`pdk-nightly\` run [${context.runId}](${runUrl}) failed on ` +
                `\`${context.ref}\` (${context.eventName}, commit ${context.sha.slice(0, 7)}).`,
              '',
              'Failing job(s):',
              failed,
              '',
              'This workflow is not a PR check, so nothing else reports it. See the ' +
                'run log for the specific `STALE` / `ERC` / `DRIFT` lines; ' +
                '`design/netlist.py --pdk` output near the top of the netlist-check ' +
                'job attributes the failure to the netlister version, the PDK pin, ' +
                'or neither.',
            ].join('\n');

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', labels: 'loom:triage', per_page: 100,
            });
            const tracker = existing.find((i) => (i.body || '').includes(MARKER));

            if (tracker) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: tracker.number, body,
              });
              core.notice(`pdk-nightly still red; commented on #${tracker.number}`);
            } else {
              const created = await github.rest.issues.create({
                ...context.repo,
                title: 'pdk-nightly is red',
                body: `${MARKER}\n\n${body}`,
                labels: ['loom:triage', 'tier:maintenance'],
              });
              core.notice(`pdk-nightly went red; filed #${created.data.number}`);
            }
